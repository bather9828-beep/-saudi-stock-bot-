name: Saudi Stock Market Scanner

on:
  schedule:
    # يعمل كل 5 دقائق من الأحد للخميس (توقيت السوق السعودي: 7am - 12pm UTC = 10am - 3pm السعودية)
    - cron: '*/5 7-12 * * 0,2-6'
  workflow_dispatch: # يسمح لك بتشغيل البوت يدوياً في أي وقت

permissions:
  contents: write

jobs:
  scan-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Save all data files
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'bot@github.com'
          git add -A
          git diff --staged --quiet || (git commit -m " Save bot data [skip ci]" && git pull --rebase && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
